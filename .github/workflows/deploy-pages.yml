name: Deploy GREEKS dashboard to Pages

on:
  push:
    branches: [main]
    paths:
      - "Market_Risk/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact (Market_Risk folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: Market_Risk

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
